stages:
  - test

default:
  tags:
    - k8s
    - amd64
  before_script:
    - test/docker_test/github_status.sh pending
    - set +e

variables:
  REPO_NAME: module-oracle

.oracle_test:
  stage: test
  services:
    - name: gvenzl/oracle-free:slim
      alias: oracle
      pull_policy: always
  variables:
    ORACLE_PASSWORD: omq
    DOCKER_ORACLE: "1"
  script:
    # NOTE: "set +e" above means that a failure here would otherwise be ignored; the exit status must
    # be checked explicitly, otherwise the test suite runs against a DB that never came up and the
    # real cause is buried under misleading test failures
    - |
        if ! test/docker_test/init_oracle.sh; then
          echo "ERROR: the Oracle DB is not available; aborting the build without running any tests" >&2
          test/docker_test/github_status.sh failure
          exit 1
        fi
    - |
        if ${TEST_SCRIPT}; then
          test/docker_test/github_status.sh success
          exit 0
        else
          test/docker_test/github_status.sh failure
          exit 1
        fi

test-ubuntu:
  extends: .oracle_test
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  variables:
    TEST_SCRIPT: test/docker_test/test-ubuntu.sh

test-alpine:
  extends: .oracle_test
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine
  variables:
    TEST_SCRIPT: test/docker_test/test-alpine.sh
