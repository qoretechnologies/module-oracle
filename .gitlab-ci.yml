stages:
  - test

default:
  tags:
    - k8s
    - amd64
  before_script:
    - test/docker_test/github_status.sh pending
    - set +e

variables:
  REPO_NAME: module-oracle

.oracle_test:
  stage: test
  services:
    - name: gvenzl/oracle-free:slim
      alias: oracle
      pull_policy: always
  variables:
    ORACLE_PASSWORD: omq
    DOCKER_ORACLE: "1"
    # the Oracle Free service container needs more than the runner's 4Gi default while it
    # initializes its datafiles on first boot.  At 4Gi it is OOMKilled within seconds; job pods use
    # restartPolicy "Never", so the sidecar never comes back and the listener never appears, which
    # looks like a DB that is merely slow to start.  Peak usage depends on how quickly dirty pages
    # are written back, so this only bites when the cluster is under load (verified on the CI
    # cluster: 4Gi -> OOMKilled after 7s, 8Gi -> "DATABASE IS READY TO USE" after 41s)
    KUBERNETES_SERVICE_MEMORY_REQUEST: 4Gi
    KUBERNETES_SERVICE_MEMORY_LIMIT: 8Gi
  script:
    # NOTE: "set +e" above means that a failure here would otherwise be ignored; the exit status must
    # be checked explicitly, otherwise the test suite runs against a DB that never came up and the
    # real cause is buried under misleading test failures
    - |
        if ! test/docker_test/init_oracle.sh; then
          echo "ERROR: the Oracle DB is not available; aborting the build without running any tests" >&2
          test/docker_test/github_status.sh failure
          exit 1
        fi
    - |
        if ${TEST_SCRIPT}; then
          test/docker_test/github_status.sh success
          exit 0
        else
          test/docker_test/github_status.sh failure
          exit 1
        fi

test-ubuntu:
  extends: .oracle_test
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  variables:
    TEST_SCRIPT: test/docker_test/test-ubuntu.sh

test-alpine:
  extends: .oracle_test
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine
  variables:
    TEST_SCRIPT: test/docker_test/test-alpine.sh
